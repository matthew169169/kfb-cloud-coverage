name: live-predict

# Publishes live.json (latest KFB frame + model prediction) to the
# single-commit `live-data` branch, which the Pages app reads via
# raw.githubusercontent.com (CORS-enabled).
#
# GitHub's high-frequency cron (*/5) fires unreliably, so instead the job is
# scheduled every 30 minutes and each run loops internally, refreshing every
# 5 minutes for ~35 minutes. Overlapping runs hand over via the concurrency
# group (the newer run cancels the older loop).

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-predict
  cancel-in-progress: true

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install minimal deps
        run: pip install --quiet numpy Pillow

      - name: Predict and publish every 5 minutes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -u
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in $(seq 1 7); do
            if python -m src.live --json live.json; then
              rm -rf /tmp/live && mkdir -p /tmp/live
              cp live.json /tmp/live/
              (
                cd /tmp/live
                git init -q -b live-data
                git add live.json
                git commit -qm "live: $(date -u +%FT%TZ)"
                git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" live-data
              ) || echo "publish failed on iteration $i (will retry next loop)"
            else
              echo "predict failed on iteration $i (will retry next loop)"
            fi
            [ "$i" -lt 7 ] && sleep 300
          done
